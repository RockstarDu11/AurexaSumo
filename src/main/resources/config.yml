# AurexaSumo - configuration
prefix: "&6&lAurexalium &c&l>> &e"

# Decompte (en secondes) avant le debut quand assez de joueurs sont la
start-countdown: 20

# Decompte (en secondes) avant chaque combat
fight-countdown: 3

# Nombre de rounds par match (au meilleur des X : 5 = le premier a 3 rounds gagne)
rounds-per-match: 5

# Duree maximale d'un round (en secondes). Si le temps est ecoule,
# celui qui est le plus loin du centre de la zone perd.
round-time: 60

# Commande console executee pour donner des points (PlayerPoints)
# {player} = pseudo, {amount} = montant. Laisse vide pour desactiver.
coins-command: "points give {player} {amount}"

# Les coins sont donnes uniquement a la fin de la partie
coins:
  win: 100            # le gagnant
  second: 40          # le finaliste (dernier elimine)
  participation: 10   # tous les autres

# Commande console lancee pour chaque joueur qui sort d'une partie (fin ou depart).
# Sert a vider son inventaire avec le Skript invreset.sk. Laisse vide pour desactiver.
end-command: "invreset {player}"
